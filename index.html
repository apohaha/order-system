<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>入單系統 v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f2f2f7;--surface:#fff;--border:#e5e5ea;--border2:#c7c7cc;
  --text:#000;--text2:#3c3c43;--text3:#8e8e93;
  --accent:#007aff;--accent-bg:#e8f2ff;
  --green:#34c759;--green-bg:#e8f5ee;--green-dark:#248a3d;
  --red:#ff3b30;--orange:#ff9500;--orange-bg:#fff5e6;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* screens */
.app{flex:1;overflow:hidden;position:relative}
.screen{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
/* nav */
.nav-bar{background:var(--surface);border-bottom:.5px solid var(--border2);padding:14px 16px 12px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:20px;font-weight:700}
.nav-sub{font-size:13px;color:var(--text3);margin-top:1px}
.nav-action{font-size:15px;color:var(--accent);font-weight:500;background:none;border:none;cursor:pointer;padding:4px 0;font-family:inherit}
/* tab bar */
.tab-bar{background:var(--surface);border-top:.5px solid var(--border2);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;cursor:pointer;border:none;background:none;font-family:inherit;font-size:10px;color:var(--text3);transition:color .15s}
.tab-item svg{width:24px;height:24px}
.tab-item.active{color:var(--accent)}
/* session bar */
.session-bar{background:var(--accent);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:57px;z-index:40}
.session-bar .sb-label{font-size:12px;color:rgba(255,255,255,.8);flex-shrink:0}
.session-bar .sb-name{font-size:14px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-bar .sb-btn{background:rgba(255,255,255,.2);border:none;border-radius:6px;padding:5px 10px;font-size:12px;color:#fff;font-weight:600;font-family:inherit;cursor:pointer;flex-shrink:0}
/* forms */
.section{padding:16px}
.group{background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.group-row{display:flex;align-items:center;padding:13px 16px;border-bottom:.5px solid var(--border);gap:10px}
.group-row:last-child{border-bottom:none}
.group-row label{font-size:14px;color:var(--text3);width:50px;flex-shrink:0}
.group-row input,.group-row select,.group-row textarea{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;background:transparent;color:var(--text)}
.group-row textarea{resize:none;line-height:1.4}
select{-webkit-appearance:none;appearance:none}
/* product rows */
.prod-row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;padding:10px 16px;border-bottom:.5px solid var(--border)}
.prod-row:last-child{border-bottom:none}
.prod-row select,.prod-row input{border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;width:100%;color:var(--text)}
.prod-row .pr-qty{text-align:right}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;border:none;font-family:inherit;width:100%;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--accent);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:var(--surface);color:var(--accent);border:.5px solid var(--border2)}
.btn-red{background:var(--red);color:#fff}
.add-row-btn{display:flex;align-items:center;gap:6px;padding:12px 16px;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;font-family:inherit}
/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface);border-radius:var(--radius);padding:14px 16px}
.stat-box .sl{font-size:12px;color:var(--text3);margin-bottom:2px}
.stat-box .sv{font-size:22px;font-weight:700}
/* orders list */
.order-card{background:var(--surface);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.order-card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--bg);border-bottom:.5px solid var(--border)}
.order-card-head .oc-name{font-weight:600}
.order-card-head .oc-id{font-size:12px;color:var(--text3);font-family:monospace;margin-right:6px}
.order-item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:.5px solid var(--border);font-size:14px}
.order-item-row:last-child{border-bottom:none}
.order-item-row .oi-cat{font-size:12px;color:var(--text3);margin-right:4px}
.order-item-row .oi-qty{font-weight:700;color:var(--red)}
/* section title */
.section-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-left:4px}
/* manage accordion */
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
.acc-head .ah-title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.acc-head .ah-right{display:flex;align-items:center;gap:10px}
.acc-head .ah-chevron{font-size:12px;color:var(--text3);transition:transform .2s}
.acc-body{display:none;border-top:.5px solid var(--border)}
/* autocomplete */
.ac-wrap{position:relative;flex:1}
.ac-list{position:absolute;top:100%;left:-16px;right:-16px;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius-sm);z-index:200;max-height:200px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.ac-item{padding:11px 16px;cursor:pointer;font-size:14px;border-bottom:.5px solid var(--border)}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--bg)}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
/* toast */
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:all .22s;pointer-events:none;z-index:9999;white-space:nowrap;font-weight:500}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
/* error bar */
#error-bar{position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--red);color:#fff;padding:10px 16px;font-size:13px;display:none;word-break:break-all}
/* summary */
.sum-cat{font-size:12px;font-weight:700;color:var(--accent);padding:6px 14px;background:var(--accent-bg);letter-spacing:.05em}
.sum-prod{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 14px;border-bottom:.5px solid var(--border)}
.sum-prod:last-child{border-bottom:none}
.sum-prod .sp-name{font-weight:600;font-size:14px;margin-bottom:3px}
.sum-prod .sp-buyers{font-size:13px;color:var(--text3)}
.sum-prod .sp-qty{font-size:15px;font-weight:800;color:var(--red);flex-shrink:0;margin-left:8px}
/* notion debug */
#notion-debug{font-size:12px;color:var(--text3);font-family:monospace;line-height:1.8;padding:10px 14px}
/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty .ei{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>

<div id="error-bar"></div>

<!-- ══ APP ══ -->
<div class="app">

<!-- ══ SCREEN 1: 入單 ══ -->
<div id="screen-enter" class="screen active">
  <div class="nav-bar">
    <div><div class="nav-title">新增訂單</div><div class="nav-sub" id="enter-badge"></div></div>
    <button class="nav-action" onclick="resetForm()">清除</button>
  </div>
  <div class="session-bar">
    <span class="sb-label">目前場次</span>
    <span class="sb-name" id="session-name-display">未選擇場次</span>
    <button class="sb-btn" onclick="openSessionPicker()">切換</button>
  </div>
  <div class="section">
    <!-- customer -->
    <div class="group">
      <div class="group-row">
        <label>客戶</label>
        <div class="ac-wrap">
          <input type="text" id="f-customer" placeholder="輸入名稱或編號…" autocomplete="off" oninput="onCustInput()">
          <div class="ac-list" id="cust-ac" style="display:none"></div>
        </div>
      </div>
      <div class="group-row">
        <label>備註</label>
        <input type="text" id="f-note" placeholder="整筆訂單備註（選填）">
      </div>
    </div>
    <!-- products -->
    <div class="group" id="prod-group">
      <div style="padding:10px 16px 4px;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;color:var(--text3);font-weight:600">商品項目</span>
        <span style="font-size:12px;color:var(--text3)">最多 10 項</span>
      </div>
      <div style="display:grid;grid-template-columns:110px 1fr 70px;gap:8px;padding:6px 16px 4px">
        <span style="font-size:12px;color:var(--text3)">類別</span>
        <span style="font-size:12px;color:var(--text3)">商品</span>
        <span style="font-size:12px;color:var(--text3);text-align:right">數量</span>
      </div>
      <div id="prod-rows"></div>
      <button class="add-row-btn" onclick="addRow()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        新增一項商品
      </button>
    </div>
    <button class="btn btn-primary" onclick="submitOrder()" style="margin-bottom:20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      新增訂單
    </button>
  </div>
</div>

<!-- ══ SCREEN 2: 我的訂單 ══ -->
<div id="screen-orders" class="screen">
  <div class="nav-bar"><div class="nav-title">我的訂單</div></div>
  <div class="section">
    <div class="stats-grid" id="orders-stats"></div>
    <div id="orders-list"></div>
  </div>
</div>

<!-- ══ SCREEN 3: 匯出 ══ -->
<div id="screen-merge" class="screen">
  <div class="nav-bar"><div class="nav-title">匯出</div></div>
  <div class="section">
    <div class="stats-grid" id="export-stats"></div>
    <button class="btn btn-green" onclick="exportExcel()" style="margin-bottom:14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      匯出 Excel
    </button>
    <div class="section-title">彙總預覽</div>
    <div class="group" id="export-summary"></div>
  </div>
</div>

<!-- ══ SCREEN 4: 資料管理 ══ -->
<div id="screen-manage" class="screen">
  <div class="nav-bar"><div class="nav-title">資料管理</div></div>
  <div class="section">

    <!-- 清空 -->
    <div class="group" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px">
        <div>
          <div style="font-weight:600">清空所有記憶</div>
          <div style="font-size:13px;color:var(--text3)">清除本機所有資料</div>
        </div>
        <button onclick="clearAll()" style="background:var(--red);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">清空</button>
      </div>
    </div>

    <!-- Notion -->
    <div class="section-title">Notion 同步</div>
    <div class="group" style="margin-bottom:14px">
      <div style="padding:14px 16px;border-bottom:.5px solid var(--border)">
        <div style="font-size:12px;color:var(--text3);margin-bottom:6px;font-weight:600">Notion Integration Token</div>
        <input type="password" id="notion-token" placeholder="ntn_xxxxxxxxx"
          style="width:100%;border:.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;font-family:monospace;outline:none;background:var(--bg)">
        <div style="font-size:11px;color:var(--text3);margin-top:6px">Token 只存在你的瀏覽器，不會外洩</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr">
        <button onclick="notionPush()" style="padding:14px;border:none;border-right:.5px solid var(--border);background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">↑ 推送訂單</button>
        <button onclick="notionInit()" style="padding:14px;border:none;background:var(--green-bg);color:var(--green-dark);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">⬇ 初始讀取</button>
      </div>
      <button onclick="notionDedup()" style="width:100%;padding:12px;border:none;border-top:.5px solid var(--border);background:var(--orange-bg);color:var(--orange);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer">🧹 清除 Notion 重複訂單</button>
      <div id="notion-debug"></div>
    </div>

    <!-- 商品清單 -->
    <div class="group" style="margin-bottom:14px">
      <div class="acc-head" onclick="toggleAcc('prod')">
        <div class="ah-title">
          商品清單
          <a href="https://app.notion.com/p/3a591cc8989980fca360d17bb4205338?v=3a591cc8989980cd84bb000cb64a433f" target="_blank" onclick="event.stopPropagation()" style="color:var(--text3);display:flex">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
        <div class="ah-right">
          <button onclick="event.stopPropagation();notionPullProducts()" style="background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer">↓ 讀取</button>
          <span class="ah-chevron" id="prod-chevron">▼</span>
        </div>
      </div>
      <div class="acc-body" id="prod-body"><div id="prod-list"></div></div>
    </div>

    <!-- 客戶名單 -->
    <div class="group" style="margin-bottom:20px">
      <div class="acc-head" onclick="toggleAcc('cust')">
        <div class="ah-title">
          客戶名單
          <a href="https://app.notion.com/p/3a691cc89899802298fbe170a69b903c?v=8852d6ea408943c2b79f07681c3d1781" target="_blank" onclick="event.stopPropagation()" style="color:var(--text3);display:flex">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
        <div class="ah-right">
          <button onclick="event.stopPropagation();notionPullCustomers()" style="background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer">↓ 讀取</button>
          <span class="ah-chevron" id="cust-chevron">▼</span>
        </div>
      </div>
      <div class="acc-body" id="cust-body"><div id="cust-list"></div></div>
    </div>

  </div>
</div>

</div><!-- end app -->

<!-- ══ TAB BAR ══ -->
<div class="tab-bar">
  <button class="tab-item active" id="tab-enter" onclick="switchScreen('enter')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
    <span>入單</span>
  </button>
  <button class="tab-item" id="tab-orders" onclick="switchScreen('orders')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <span>我的訂單</span>
  </button>
  <button class="tab-item" id="tab-merge" onclick="switchScreen('merge')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span>匯出</span>
  </button>
  <button class="tab-item" id="tab-manage" onclick="switchScreen('manage')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span>管理</span>
  </button>
</div>

<!-- ══ MODALS ══ -->
<div class="modal-overlay" id="modal-session" onclick="closeModal('modal-session')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">選擇場次</div>
    <div id="session-list"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-session')">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm" onclick="closeModal('modal-confirm')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="confirm-msg" style="white-space:pre-line"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-confirm')">取消</button>
      <button class="btn btn-red" id="confirm-ok">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══ NOTION CONFIG ══
var WORKER = 'https://notion-api-proxy.eatapo.workers.dev';
var DB = {
  orders:    '3a691cc8-9899-806f-9ca1-fae7bcaba5d6',
  customers: '3a691cc8-9899-8022-98fb-e170a69b903c',
  products:  '3a591cc8-9899-80fc-a360-d17bb4205338',
  sessions:  '3a691cc8-9899-8006-8cbe-fd3aa93a7c91'
};

// ══ STATE ══
var S = { orders:[], products:[], customers:[], sessions:[], currentSession:'', currentSessionName:'' };
try {
  var _s = localStorage.getItem('oss_v5');
  if(_s) { var _p = JSON.parse(_s); for(var k in _p) S[k]=_p[k]; }
} catch(e){}
['orders','products','customers','sessions'].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });

function save(){
  try{ localStorage.setItem('oss_v5', JSON.stringify(S)); }catch(e){}
}

// ══ TOKEN ══
function getToken(){
  var el = document.getElementById('notion-token');
  var t = (el && el.value.trim()) || '';
  if(!t){ try{ t = localStorage.getItem('notion_token')||''; }catch(e){} }
  return t;
}
function saveToken(){
  var el = document.getElementById('notion-token');
  if(!el) return;
  try{ localStorage.setItem('notion_token', el.value.trim()); }catch(e){}
}
function loadToken(){
  var el = document.getElementById('notion-token');
  if(!el) return;
  try{ var t = localStorage.getItem('notion_token'); if(t) el.value = t; }catch(e){}
}

// ══ TOAST ══
var _toastT;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT); _toastT = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

// ══ ERROR BAR ══
window.onerror = function(msg, src, line){
  var el = document.getElementById('error-bar');
  if(el){ el.style.display='block'; el.textContent='錯誤: '+msg+' (line '+line+')'; }
};

// ══ NAV ══
function switchScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.tab-item').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('screen-'+name).classList.add('active');

// ══ SUBMIT ══
function submitOrder(){
  var customer = document.getElementById('f-customer').value.trim();
  var note = document.getElementById('f-note').value.trim();
  if(!customer){ toast('請填入客戶名稱'); return; }
  if(!S.currentSessionName){ toast('請先選擇場次'); openSessionPicker(); return; }
  var custObj = S.customers.find(function(c){ return c.name===customer||c.id===customer; });
  if(!custObj){ toast('找不到客戶「'+customer+'」，請確認'); return; }
  var rows = document.querySelectorAll('#prod-rows .prod-row');
  var items=[]; var err=false;
  rows.forEach(function(row){
    if(err) return;
    var cat=row.querySelector('.pr-cat').value;
    var prod=row.querySelector('.pr-prod').value;
    var qty=parseInt(row.querySelector('.pr-qty').value)||0;
    if(!cat||!prod){ toast('請選擇類別和商品'); err=true; return; }
    if(qty<1){ toast('數量需≥1'); err=true; return; }
    var p = S.products.find(function(x){ return x.name===prod&&x.cat===cat; })||{};
    items.push({cat:cat,product:prod,qty:qty,price:p.price||0});
  });
  if(err||!items.length) return;
  var time = new Date().toLocaleString('zh-TW',{hour12:false});
  items.forEach(function(item){
    var orderId = Date.now()+'-'+Math.random().toString(36).substr(2,8);
    S.orders.push({
      customer:custObj.name, customerId:custObj.id,
      cat:item.cat, product:item.product, qty:item.qty, price:item.price,
      note:'', orderNote:note, time:time,
      session:S.currentSessionName, orderId:orderId
    });
  });
  save(); updateBadge(); resetForm();
  toast('✓ '+custObj.name+' — 已新增 '+items.length+' 項');
}

}

function renderOrders(){

  var statsEl = document.getElementById('orders-stats');
  var listEl = document.getElementById('orders-list');

  if(!orders.length){ listEl.innerHTML='<div class="empty"><div class="ei">📋</div><p>尚無訂單</p></div>'; return; }
  // group by customer
  var byC={};
  orders.forEach(function(o){

    byC[o.customer].items.push(o);

// ══ EXPORT ══
function renderExport(){
  var sess = S.currentSessionName;
  var orders = sess ? S.orders.filter(function(o){ return o.session===sess; }) : S.orders;
  var custs = new Set(orders.map(function(o){ return o.customer; })).size;
  var totalQty = orders.reduce(function(a,o){ return a+(o.qty||0); },0);
  var totalAmt = orders.reduce(function(a,o){ return a+((o.price||0)*(o.qty||0)); },0);
  document.getElementById('export-stats').innerHTML =
    '<div class="stat-box"><div class="sl">客戶數</div><div class="sv">'+custs+'</div></div>'+
    '<div class="stat-box"><div class="sl">訂單筆數</div><div class="sv">'+orders.length+'</div></div>'+
    '<div class="stat-box"><div class="sl">商品總數</div><div class="sv">'+totalQty+'</div></div>'+
    '<div class="stat-box"><div class="sl">總金額</div><div class="sv" style="color:var(--accent)">$'+totalAmt.toLocaleString()+'</div></div>';
  // summary by cat
  var catMap={};
  orders.forEach(function(o){
    var cat=o.cat||'未分類';
    var key=cat+'|||'+o.product;
    if(!catMap[cat]) catMap[cat]={};
    if(!catMap[cat][key]) catMap[cat][key]={product:o.product,buyers:[]};
    catMap[cat][key].buyers.push({customer:o.customer,qty:o.qty});
  });
  var sumEl = document.getElementById('export-summary');
  if(!Object.keys(catMap).length){ sumEl.innerHTML='<div class="empty" style="padding:20px"><p>尚無資料</p></div>'; return; }
  sumEl.innerHTML = Object.keys(catMap).map(function(cat){
    var prods = catMap[cat];
    return '<div class="sum-cat">'+cat+'</div>'+Object.values(prods).map(function(p){
      var total=p.buyers.reduce(function(a,b){ return a+b.qty; },0);
      return '<div class="sum-prod"><div><div class="sp-name">'+p.product+'</div><div class="sp-buyers">'+p.buyers.map(function(b){ return b.customer+' ×'+b.qty; }).join('　')+'</div></div><div class="sp-qty">共 '+total+'</div></div>';
    }).join('');
  }).join('');
}

// ══ NOTION API ══
function notionRequest(method, path, body, cb){
  var token = getToken();
  if(!token){ toast('請先填入 Notion Token'); if(cb) cb(null); return; }
  var opts = {
    method:method,
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}
  };
  if(body) opts.body = JSON.stringify(body);
  fetch(WORKER+path, opts)
    .then(function(r){ return r.json(); })
    .then(function(data){ 
      if(data&&data.message){
        var dbg=document.getElementById('notion-debug');
        if(dbg) dbg.textContent+='\n❌ '+data.message;
      }
      if(cb) cb(data); 
    })
    .catch(function(e){ 
      var dbg=document.getElementById('notion-debug');
      if(dbg) dbg.textContent+='\n❌ 網路錯誤：'+e.message;
      toast('網路錯誤：'+e.message); 
      if(cb) cb(null); 
    });
}

function notionQueryAll(dbId, filter, cb){
  var results=[];
  function fetchPage(cursor){
    var body={page_size:100};
    if(filter) body.filter=filter;
    if(cursor) body.start_cursor=cursor;
    notionRequest('POST','/v1/databases/'+dbId+'/query',body,function(data){
      if(!data){ cb(results); return; }
      if(data.status&&data.status===401){ toast('Token 無效，請重新填入'); cb(results); return; }
      if(data.status&&data.status===404){ toast('資料庫 ID 錯誤'); cb(results); return; }
      if(!data.results){ 
        var dbg=document.getElementById('notion-debug');
        if(dbg) dbg.textContent+='\n⚠️ 回應：'+JSON.stringify(data).substr(0,100);
        cb(results); return; 
      }
      results=results.concat(data.results);
      if(data.has_more&&data.next_cursor) fetchPage(data.next_cursor);
      else cb(results);
    });
  }
  fetchPage(null);
}

          }).filter(function(o){ return o.product&&o.customer&&!o.deleted; });
          save(); updateBadge(); renderProdList(); renderCustList();
          dbg.textContent+='\n✅ 完成！';
          toast('✓ 初始讀取完成');
        });
      });
    });
  });
}

// ── 推送訂單 ──
function notionPush(){
  var token=getToken(); if(!token) return;
  var sess=S.currentSessionName;
  var orders=sess?S.orders.filter(function(o){ return o.session===sess; }):S.orders;
  if(!orders.length){ toast('沒有訂單可推送'); return; }
  // 補 orderId
  var needSave=false;
  orders.forEach(function(o){
    if(!o.orderId){ o.orderId=Date.now()+'-'+Math.random().toString(36).substr(2,8); needSave=true; }
  });
  if(needSave) save();
  var dbg=document.getElementById('notion-debug');
  dbg.textContent='🔄 讀取 Notion 現有訂單…';
  var filter=sess?{property:'場次',rich_text:{equals:sess}}:null;
  notionQueryAll(DB.orders,filter,function(existing){
    dbg.textContent+='\nNotion 現有：'+existing.length+' 筆';
    var notionMap={};
    existing.forEach(function(r){
      var oid=(r.properties['訂單ID']&&r.properties['訂單ID'].rich_text&&r.properties['訂單ID'].rich_text[0]&&r.properties['訂單ID'].rich_text[0].plain_text)||'';
      if(oid) notionMap[oid]={
        pageId:r.id,
        deleted:(r.properties['已刪除']&&r.properties['已刪除'].checkbox)||false,
        sig:[
          (r.properties['商品名稱']&&r.properties['商品名稱'].title&&r.properties['商品名稱'].title[0]&&r.properties['商品名稱'].title[0].plain_text)||'',
          (r.properties['客戶名稱']&&r.properties['客戶名稱'].rich_text&&r.properties['客戶名稱'].rich_text[0]&&r.properties['客戶名稱'].rich_text[0].plain_text)||'',
          (r.properties['數量']&&r.properties['數量'].number)||0,
          (r.properties['場次']&&r.properties['場次'].rich_text&&r.properties['場次'].rich_text[0]&&r.properties['場次'].rich_text[0].plain_text)||''
        ].join('|')
      };
    });
    var localIds=new Set(orders.map(function(o){ return o.orderId; }));
    var added=0,updated=0,skipped=0,deleted=0,fail=0;
    var queue=orders.slice();
    dbg.textContent+='\n比對推送中…';
    function processNext(){
      if(!queue.length){
        // 標記刪除
        var toDelete=Object.keys(notionMap).filter(function(oid){ return !localIds.has(oid)&&!notionMap[oid].deleted; });
        var dq=toDelete.slice();
        function deleteNext(){
          if(!dq.length){
            save();
            dbg.textContent+='\n✅ 完成！新增 '+added+'・更新 '+updated+'・略過 '+skipped+'・刪除 '+deleted+(fail?'・失敗 '+fail:'');
            toast('✓ 推送完成');
            return;
          }
          var oid=dq.shift();
          notionRequest('PATCH','/v1/pages/'+notionMap[oid].pageId,{properties:{'已刪除':{checkbox:true}}},function(r){ if(r) deleted++; else fail++; deleteNext(); });
        }
        deleteNext();
        return;
      }
      var o=queue.shift();
      var localSig=[o.product,o.customer,o.qty,o.session].join('|');
      var props={
        '商品名稱':{title:[{text:{content:o.product||''}}]},
        '客戶名稱':{rich_text:[{text:{content:o.customer||''}}]},
        '客戶編號':{rich_text:[{text:{content:o.customerId||''}}]},
        '類別':{rich_text:[{text:{content:o.cat||''}}]},
        '數量':{number:o.qty||0},
        '價錢':{number:o.price||0},
        '整筆備註':{rich_text:[{text:{content:o.orderNote||''}}]},
        '場次':{rich_text:[{text:{content:o.session||''}}]},
        '入單時間':{rich_text:[{text:{content:o.time||''}}]},
        '訂單ID':{rich_text:[{text:{content:o.orderId||''}}]},
        '已刪除':{checkbox:false}
      };
      if(notionMap[o.orderId]){
        if(notionMap[o.orderId].sig===localSig&&!notionMap[o.orderId].deleted){ skipped++; processNext(); return; }
        notionRequest('PATCH','/v1/pages/'+notionMap[o.orderId].pageId,{properties:props},function(r){ if(r) updated++; else fail++; processNext(); });
      } else {
        notionRequest('POST','/v1/pages',{parent:{database_id:DB.orders},properties:props},function(r){ if(r&&r.id) added++; else fail++; processNext(); });
      }
    }
    processNext();
  });
}

// ── 清除重複 ──
function notionDedup(){
  var token=getToken(); if(!token) return;
  var dbg=document.getElementById('notion-debug');
  dbg.textContent='🔍 讀取 Notion 所有訂單…';
  notionQueryAll(DB.orders,null,function(all){
    dbg.textContent+='\n共 '+all.length+' 筆';
    var seen={};
    var toDelete=[];
    all.forEach(function(r){
      var p=r.properties;
      var key=[
        (p['客戶名稱']&&p['客戶名稱'].rich_text&&p['客戶名稱'].rich_text[0]&&p['客戶名稱'].rich_text[0].plain_text)||'',
        (p['商品名稱']&&p['商品名稱'].title&&p['商品名稱'].title[0]&&p['商品名稱'].title[0].plain_text)||'',
        (p['數量']&&p['數量'].number)||0,
        (p['入單時間']&&p['入單時間'].rich_text&&p['入單時間'].rich_text[0]&&p['入單時間'].rich_text[0].plain_text)||''
      ].join('|');
      var del=(p['已刪除']&&p['已刪除'].checkbox)||false;
      if(del) return;
      if(seen[key]) toDelete.push(r.id); else seen[key]=true;
    });
    dbg.textContent+='\n發現 '+toDelete.length+' 筆重複';
    if(!toDelete.length){ dbg.textContent+='\n✅ 沒有重複！'; return; }
    var ok=0,fail=0;
    var q=toDelete.slice();
    function next(){
      if(!q.length){ dbg.textContent+='\n✅ 已標記刪除 '+ok+' 筆'; toast('✓ 清除完成'); return; }
      var id=q.shift();
      notionRequest('PATCH','/v1/pages/'+id,{properties:{'已刪除':{checkbox:true}}},function(r){ if(r) ok++; else fail++; next(); });
    }
    next();
  });
}

// ── 讀取商品 ──
function notionPullProducts(){
  var token=getToken(); if(!token) return;
  var dbg=document.getElementById('notion-debug');
  dbg.textContent='🔄 讀取商品清單…';
  notionQueryAll(DB.products,null,function(r){
    S.products=r.map(function(x){
      var p=x.properties;
      return {
        name:(p['商品名稱']&&p['商品名稱'].title&&p['商品名稱'].title[0]&&p['商品名稱'].title[0].plain_text)||'',
        cat:(p['類別']&&p['類別'].rich_text&&p['類別'].rich_text[0]&&p['類別'].rich_text[0].plain_text)||'',
        price:(p['價格']&&p['價格'].number)||0
      };
    }).filter(function(p){ return p.name; });
    save(); renderProdList();
    dbg.textContent+='\n✅ 商品：'+S.products.length+' 件';
    toast('✓ 商品讀取完成');
  });
}

// ── 讀取客戶 ──
function notionPullCustomers(){
  var token=getToken(); if(!token) return;
  var dbg=document.getElementById('notion-debug');
  dbg.textContent='🔄 讀取客戶名單…';
  notionQueryAll(DB.customers,null,function(r){
    S.customers=r.map(function(x){
      var p=x.properties;
      return {
        name:(p['姓名']&&p['姓名'].title&&p['姓名'].title[0]&&p['姓名'].title[0].plain_text)||'',
        id:(p['編號']&&p['編號'].rich_text&&p['編號'].rich_text[0]&&p['編號'].rich_text[0].plain_text)||''
      };
    }).filter(function(c){ return c.name; });
    save(); renderCustList();
    dbg.textContent+='\n✅ 客戶：'+S.customers.length+' 位';
    toast('✓ 客戶讀取完成');
  });
}
